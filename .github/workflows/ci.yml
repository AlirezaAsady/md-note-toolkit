name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -v

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The GUI tests build a real Tk window, so the runner needs the Tk
      # runtime and a virtual display. The distro Python is used on purpose:
      # apt's python3-tk only matches the distro's own minor version, and a
      # mismatched _tkinter .so cannot be imported.
      - name: Install Tk, Xvfb and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-pytest xvfb
          python3 --version
          python3 -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Run tests
        run: xvfb-run -a python3 -m pytest -v
